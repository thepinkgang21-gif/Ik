name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project SwingTag.xcodeproj -scheme SwingTag -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SwingTag.app Payload/
          zip -qr SwingTag.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SwingTag-ipa
          path: SwingTag.ipa
